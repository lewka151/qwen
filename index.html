<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Qwen Coder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(100px, -100px) scale(1.1);
                opacity: 0.2;
            }
            50% {
                transform: translate(-50px, 50px) scale(0.9);
                opacity: 0.1;
            }
            75% {
                transform: translate(80px, 80px) scale(1.05);
                opacity: 0.15;
            }
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease-out forwards;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            position: fixed;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            z-index: 1;
            text-align: center;
            width: 100%;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="background-animation" id="bgAnimation"></div>
    
    <div class="container">
        <h1>Hello World!</h1>
    </div>

    <div class="footer">
        Это сгенерировано с помощью qwen coder
    </div>

    <script>
        // Создаем фоновые круги
        const bgAnimation = document.getElementById('bgAnimation');
        const numberOfCircles = 15;

        for (let i = 0; i < numberOfCircles; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            
            // Случайный размер
            const size = Math.random() * 100 + 50;
            circle.style.width = `${size}px`;
            circle.style.height = `${size}px`;
            
            // Случайная позиция
            circle.style.left = `${Math.random() * 100}%`;
            circle.style.top = `${Math.random() * 100}%`;
            
            // Случайная задержка анимации для хаотичности
            circle.style.animationDelay = `${Math.random() * 5}s`;
            
            // Случайная продолжительность для плавности
            circle.style.animationDuration = `${Math.random() * 10 + 15}s`;
            
            bgAnimation.appendChild(circle);
        }
    </script>
</body>
</html>
