<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
        #message {
            position: absolute;
            top: 20%;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="message"></div>
    <button onclick="showMessage()">Нажми меня</button>

    <script>
        function showMessage() {
            document.getElementById('message').textContent = 'Hello World';
        }
    </script>
</body>
</html>
